<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雨晴闹钟 - 技术支持</title>
  <meta name="description" content="雨晴闹钟技术支持与常见问题">
  <style>
    :root { color-scheme: light dark; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }
    body { margin: 0; background: linear-gradient(145deg, #fff4ec, #eef0ff 55%, #f8f9ff); color: #17171c; }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px; }
    .icon { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 14px 32px #4f46e533; }
    h1 { margin: 24px 0 8px; font-size: 40px; letter-spacing: -.04em; }
    .lead { color: #64646d; font-size: 19px; line-height: 1.6; }
    section { margin-top: 32px; padding: 24px; background: #ffffffb8; border: 1px solid #ffffff; border-radius: 24px; box-shadow: 0 16px 48px #3730a30d; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    p, li { line-height: 1.75; }
    a { color: #5146e5; font-weight: 600; text-decoration: none; }
    footer { margin-top: 32px; color: #777780; font-size: 14px; }
    @media (prefers-color-scheme: dark) {
      body { background: linear-gradient(145deg, #211b18, #15162b 55%, #101116); color: #f5f5f7; }
      .lead, footer { color: #b3b3bc; }
      section { background: #ffffff0d; border-color: #ffffff12; }
      a { color: #9d97ff; }
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="app-icon.png" alt="雨晴闹钟图标">
    <h1>雨晴闹钟</h1>
    <p class="lead">根据通勤时段的降雨预报，在雨天和晴天两套时间之间自动选择。</p>

    <section>
      <h2>使用帮助</h2>
      <ol>
        <li>设置“有雨”和“无雨”两套响铃时间。</li>
        <li>选择需要重复的星期。</li>
        <li>允许定位与闹钟权限，然后打开页面顶部的总开关。</li>
      </ol>
    </section>

    <section>
      <h2>常见问题</h2>
      <p><strong>天气没有更新</strong><br>请确认定位权限和网络连接正常，然后点按天气卡片右侧的刷新按钮。</p>
      <p><strong>闹钟没有创建</strong><br>请前往系统设置，确认已允许雨晴闹钟使用闹钟权限。</p>
    </section>

    <section>
      <h2>联系支持</h2>
      <p>如遇到问题，请在 <a href="https://github.com/starim00/weatherclock-support/issues">GitHub Issues</a> 中说明设备型号、系统版本和复现步骤。</p>
      <p><a href="privacy.html">查看隐私政策</a></p>
    </section>

    <footer>© 2026 tiance hu</footer>
  </main>
</body>
</html>
